# PID gains tuned to drive the UR5e under EffortJointInterface in Gazebo.
# Values carry over from the working ur5e_robot_description controller —
# higher gains on the shoulder + elbow (large-mass-moments), lighter on
# the wrists. Robotiq 2F-85 driven via the left_knuckle joint (the
# right side mimics through the gripper's internal linkage).

joint_state_controller:
  type: joint_state_controller/JointStateController
  publish_rate: 300

arm_controller:
  type: position_controllers/JointTrajectoryController
  joints:
    - shoulder_pan_joint
    - shoulder_lift_joint
    - elbow_joint
    - wrist_1_joint
    - wrist_2_joint
    - wrist_3_joint
  gains:
    shoulder_pan_joint:  {p: 1000, d: 50,  i: 10,  i_clamp: 100}
    shoulder_lift_joint: {p: 5000, d: 30,  i: 100, i_clamp: 400}
    elbow_joint:         {p: 5000, d: 50,  i: 10,  i_clamp: 100}
    wrist_1_joint:       {p:  200, d: 20,  i: 10,  i_clamp: 100}
    wrist_2_joint:       {p:  100, d: 10,  i: 0.1, i_clamp: 100}
    wrist_3_joint:       {p:   10, d:  1,  i: 0.1, i_clamp: 100}

gripper_controller:
  type: effort_controllers/JointTrajectoryController
  joints:
    - robotiq_85_left_knuckle_joint
  gains:
    robotiq_85_left_knuckle_joint:
      p: 40
      d: 0
      i: 0
      i_clamp: 1
