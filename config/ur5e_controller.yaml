# ros_control config for the UR5e + Robotiq 2F-85 in Gazebo.
#
# The upstream UR5e xacro exposes the six arm joints through
# PositionJointInterface. gazebo_ros_control still needs plugin-level
# PID gains under /ur5e/gazebo_ros_control/pid_gains/<joint> to turn
# those position commands into stable Gazebo joint forces.
#
# The Robotiq 2F-85 exposes only the left knuckle as an EffortJointInterface
# handle; the other finger joints follow through mimic plugins/linkage.

gazebo_ros_control:
  pid_gains:
    shoulder_pan_joint:  {p: 1000, d: 50,  i: 10,  i_clamp: 100}
    shoulder_lift_joint: {p: 5000, d: 30,  i: 100, i_clamp: 400}
    elbow_joint:         {p: 5000, d: 50,  i: 10,  i_clamp: 100}
    wrist_1_joint:       {p:  200, d: 20,  i: 10,  i_clamp: 100}
    wrist_2_joint:       {p:  100, d: 10,  i: 0.1, i_clamp: 100}
    wrist_3_joint:       {p:   10, d:  1,  i: 0.1, i_clamp: 100}

joint_state_controller:
  type: joint_state_controller/JointStateController
  publish_rate: 300

arm_controller:
  type: position_controllers/JointTrajectoryController
  joints:
    - shoulder_pan_joint
    - shoulder_lift_joint
    - elbow_joint
    - wrist_1_joint
    - wrist_2_joint
    - wrist_3_joint
  gains:
    shoulder_pan_joint:  {p: 1000, d: 50,  i: 10,  i_clamp: 100}
    shoulder_lift_joint: {p: 5000, d: 30,  i: 100, i_clamp: 400}
    elbow_joint:         {p: 5000, d: 50,  i: 10,  i_clamp: 100}
    wrist_1_joint:       {p:  200, d: 20,  i: 10,  i_clamp: 100}
    wrist_2_joint:       {p:  100, d: 10,  i: 0.1, i_clamp: 100}
    wrist_3_joint:       {p:   10, d:  1,  i: 0.1, i_clamp: 100}

gripper_controller:
  type: effort_controllers/JointTrajectoryController
  joints:
    - robotiq_85_left_knuckle_joint
  gains:
    robotiq_85_left_knuckle_joint:
      p: 40
      d: 0
      i: 0
      i_clamp: 1
